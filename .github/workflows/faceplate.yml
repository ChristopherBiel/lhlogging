name: Faceplate

# The design rules are only enforceable if something checks them on every push.
# `faceplate check` reports unknown --fp-* tokens, off-palette hex, non-zero
# border radius, non-Faceplate fonts, off-scale spacing, universal resets,
# intensity drift, and a vendored dist/ whose checksums no longer match.
#
# It runs from dashboard/ so it finds dashboard/dist/MANIFEST.sha256, and it
# only reads .css/.html/.svg -- which is why the stylesheets live in
# dashboard/static/css/ rather than inline in app.py.
#
# No install step: ChristopherBiel/faceplate is private and the runner has no
# credentials for it, so the checker itself is vendored at dashboard/bin/. It
# resolves its values from the checksummed dist/tokens.json, so the brand stays
# pinned even though the tool is a plain copy. Re-pull bin/faceplate.mjs when
# bumping the vendored dist.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --strict fails on warnings too. The project is at zero findings, and
      # --fp-ext-* extensions are meant to be a flare rather than a permit, so
      # anything new should be dealt with rather than accumulated.
      - name: faceplate check
        working-directory: dashboard
        run: node bin/faceplate.mjs check . --strict

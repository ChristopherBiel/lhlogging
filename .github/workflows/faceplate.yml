name: Faceplate

# The design rules are only enforceable if something checks them on every push.
# `faceplate check` reports unknown --fp-* tokens, off-palette hex, non-zero
# border radius, non-Faceplate fonts, off-scale spacing, universal resets, an
# intensity that does not exist or differs between pages, icons off the spec,
# and a vendored dist/ whose checksums no longer match.
#
# It runs from dashboard/ so it finds dashboard/dist/MANIFEST.sha256, and it
# only reads .css/.html/.svg -- which is why the stylesheets live in
# dashboard/static/css/ and the page chassis in dashboard/chassis.html rather
# than inline in app.py.
#
# No install step: ChristopherBiel/faceplate is private and the runner has no
# credentials for it, so the checker itself is vendored at dashboard/bin/. It
# resolves its values from the checksummed dist/tokens.json, so the brand stays
# pinned even though the tool is a plain copy. Re-pull bin/faceplate.mjs,
# fonts.css and fonts/ together with dist/ when moving to another release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Every finding fails the build, warnings included: the project declares
      # no --fp-ext-* extension any more, so nothing has to be let through.
      - name: faceplate check
        working-directory: dashboard
        run: node bin/faceplate.mjs check . --strict

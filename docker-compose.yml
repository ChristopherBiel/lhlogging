services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app:ro
      - applogs:/var/log/lhlogging

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  # Nightly Lufthansa flight-status fetcher (headed Chromium under Xvfb to clear
  # Distil). Separate image from `app` because it needs a browser; talks to `db`
  # on the shared network. Browser only spins up once a night, so it's idle most
  # of the time — capped to keep it a good neighbour on the shared box.
  flightstatus:
    build: ./flightstatus
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Berlin
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - applogs:/var/log/lhlogging
    mem_limit: 1g
    shm_size: 1g

volumes:
  pgdata:
  applogs:
